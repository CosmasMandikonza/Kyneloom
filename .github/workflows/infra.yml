name: Infra CI

# KYN-14 — every infra change must COMPILE against the pinned Bicep tool,
# and the compiled ARM must pass semantic validation. This is real template
# validation (types + linter + property assertions), independent of any
# Azure subscription. Deployment itself is owner-authorized (runbook).
on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'scripts/validate-arm.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'infra/**'
      - 'scripts/validate-arm.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

jobs:
  bicep:
    name: Bicep build + ARM validation (pinned v0.48.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pinned Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Compile main template (modules included)
        run: |
          mkdir -p build
          bicep build infra/azure/main.bicep --outfile build/main.json
          python3 - <<'PY'
          import json
          d = json.load(open('build/main.json'))
          resources = d['resources']
          print(f"main.json OK — {len(resources)} top-level resources")
          assert len(resources) >= 6, 'expected the full resource chain'
          PY

      - name: Compiled-ARM semantic validation (GUIDs, SKU, references, probes)
        run: KYN_BICEP=bicep pnpm infra:validate

      - name: Compile every module standalone
        run: |
          set -e
          for m in event-hubs storage webpubsub key-vault monitor container-apps; do
            bicep build "infra/azure/modules/$m.bicep" --outfile "build/$m.json"
            echo "$m OK"
          done

      - name: No secrets in compiled outputs
        run: |
          ! grep -rEi 'accessKey|primaryKey|connectionString.{0,20}[A-Za-z0-9+/=]{20,}' build/ \
            || { echo 'ERROR: secret-looking value in compiled templates'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: arm-templates
          path: build/
