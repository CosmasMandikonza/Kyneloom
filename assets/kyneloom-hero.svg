<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" role="img" aria-labelledby="title desc">
<title id="title">Kyneloom — Every moment has a world inside</title>
<desc id="desc">Kyneloom brand art. A glowing isometric football pitch surrounded by trajectory paths and source evidence markers.</desc>
